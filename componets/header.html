<header class="sticky top-0 z-50 border-b border-plum-900/40 bg-plum-700 backdrop-blur-md">
  <nav class="mx-auto flex max-w-7xl items-center justify-between gap-8 px-5 py-6 lg:px-8" aria-label="Main">

    <!-- Logo -->
    <a href="index.html" class="flex items-center gap-4">
      <span class="grid h-16 w-16 place-items-center rounded-2xl bg-white text-plum-700 shadow-card">
        <svg class="h-9 w-9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 13.5c-2.6 0-5.3 1.9-5.3 4.2 0 1.4 1 2.3 2.4 2.3 1 0 1.9-.5 2.9-.5s1.9.5 2.9.5c1.4 0 2.4-.9 2.4-2.3 0-2.3-2.7-4.2-5.3-4.2Z"/>
          <ellipse cx="6.2" cy="10.4" rx="2" ry="2.6"/>
          <ellipse cx="17.8" cy="10.4" rx="2" ry="2.6"/>
          <ellipse cx="9.6" cy="6.4" rx="2.1" ry="2.7"/>
          <ellipse cx="14.4" cy="6.4" rx="2.1" ry="2.7"/>
        </svg>
      </span>
      <span class="font-display text-4xl font-extrabold leading-none text-white">
        Do Pet <span class="text-brand-300">Au Vet</span>
      </span>
    </a>

    <!-- Menu desktop -->
    <ul class="hidden items-center gap-12 text-lg font-semibold lg:flex">
      <li><a href="servicos.html"           class="text-white/90 transition hover:text-brand-300">Serviços</a></li>
      <li><a href="loja.html"               class="text-white/90 transition hover:text-brand-300">Loja</a></li>
      <li><a href="index.html#testimonials" class="text-white/90 transition hover:text-brand-300">Avaliações</a></li>
      <li><a href="index.html#faq"          class="text-white/90 transition hover:text-brand-300">FAQ</a></li>
    </ul>

    <!-- Ações desktop -->
    <div class="hidden items-center gap-5 lg:flex">

      <!-- Instagram -->
      <a href="https://instagram.com/dopetauvet" target="_blank" rel="noopener" aria-label="Instagram"
         class="grid h-14 w-14 place-items-center rounded-xl border border-white/25 text-white transition hover:border-white hover:bg-white hover:text-plum-700">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
      </a>

      <span class="h-8 w-px bg-white/25" aria-hidden="true"></span>

      <!-- Telefone -->
      <a href="tel:+15551234567" class="flex items-center gap-2 text-lg font-semibold text-white transition hover:text-brand-300">
        <svg class="h-6 w-6 text-brand-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>
        </svg>
        (555) 123-4567
      </a>

      <!-- CTA -->
      <a href="index.html#booking" class="rounded-full bg-white px-10 py-5 text-lg font-bold text-plum-700 shadow-card transition hover:bg-brand-100 hover:text-plum-800">
        Agende agora
      </a>
    </div>

    <!-- Botão mobile -->
    <button id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu"
            class="grid h-14 w-14 place-items-center rounded-xl border border-white/25 text-white lg:hidden">
      <span class="sr-only">Mostrar menu</span>
      <svg id="icon-open" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
      <svg id="icon-close" class="hidden h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </nav>

  <!-- Menu mobile -->
  <div id="mobile-menu" class="hidden border-t border-plum-900/40 bg-plum-700 px-5 pb-6 pt-2 lg:hidden">
    <ul class="flex flex-col divide-y divide-white/10 text-lg font-semibold">
      <li><a href="servicos.html"           class="block py-4 text-white">Serviços</a></li>
      <li><a href="loja.html"               class="block py-4 text-white">Loja</a></li>
      <li><a href="index.html#testimonials" class="block py-4 text-white">Avaliações</a></li>
      <li><a href="index.html#faq"          class="block py-4 text-white">FAQ</a></li>
    </ul>
    <a href="index.html#booking" class="mt-5 block rounded-full bg-white px-6 py-4 text-center text-lg font-bold text-plum-700">
      Agende um horário
    </a>
  </div>

  <script>
    (function () {
      const btn       = document.getElementById('menu-btn');
      const menu      = document.getElementById('mobile-menu');
      const iconOpen  = document.getElementById('icon-open');
      const iconClose = document.getElementById('icon-close');
      if (!btn || !menu) return;

      function closeMenu() {
        menu.classList.add('hidden');
        iconOpen.classList.remove('hidden');
        iconClose.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }

      btn.addEventListener('click', function () {
        const isHidden = menu.classList.toggle('hidden');
        const isOpen   = !isHidden;
        iconOpen.classList.toggle('hidden', isOpen);
        iconClose.classList.toggle('hidden', !isOpen);
        btn.setAttribute('aria-expanded', String(isOpen));
      });

      menu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', closeMenu);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeMenu();
      });
    })();
  </script>
</header>
